<div class="devlog-content container-fluid bg-dark text-light mt-5 pb-2">
    <h1>Updates</h1>
    <div class="row g-4">
        <div class="col-md-3 col-lg-2">
            <div class="devlog-buttons" role="tablist" aria-label="Devlog categories">
                @for (tab of tabs; track tab.id) {
                <button class="btn devlog-button" [class.active]="selectedTab === tab.id"
                    type="button" role="tab" [attr.aria-selected]="selectedTab === tab.id"
                    (click)="selectTab(tab.id)">
                    {{tab.label}}
                </button>
                }
            </div>
        </div>
    </div>
</div>
